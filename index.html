<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIRPdb Tranche 2 Story Map</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap");
:root {
  --bg: #14161a;
  --surface: #1d2026;
  --surface-2: #252931;
  --border: #2e333c;
  --text: #e8e9ec;
  --muted: #9096a0;
  --accent: #2dd4bf;
  --accent-tint: rgba(45, 212, 191, 0.12);
  --amber: #f59e0b;
  --amber-tint: rgba(245, 158, 11, 0.14);
  --font: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --col: 220px;
  --lane: #191b20;
  --lane-border: #2a2f37;
  --rowhead: 0px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
a { color: var(--accent); }

header { padding: 20px 24px 12px; display: grid; gap: 12px; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 0.85rem; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; font: inherit; height: 38px;
}
select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--surface); color: var(--muted); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.82rem; cursor: pointer; min-height: 34px;
}
.chip[aria-pressed=true] { color: var(--accent); border-color: var(--accent); background: var(--accent-tint); }

/* ---------- map (desktop) ---------- */
.map-wrap { overflow: auto; padding: 0 24px 40px; max-height: calc(100vh - 150px); }
.map { display: grid; grid-template-columns: repeat(var(--cols), minmax(var(--col), 1fr)); gap: 0 14px; min-width: calc(var(--cols) * (var(--col) + 14px)); }
.lane { grid-row: 1 / -1; background: var(--lane); border: 1px solid var(--lane-border); border-radius: 12px; }
.epic {
  position: sticky; top: 0; z-index: 3; background: var(--bg);
  margin-right: -14px; padding: 0 14px 0 0;
}
.epic-lane-top {
  background: var(--lane); border: 1px solid var(--lane-border); border-bottom: 0;
  border-radius: 12px 12px 0 0; padding: 8px 8px 10px; height: 100%;
}
.epic-inner {
  background: var(--surface-2); border: 1px solid var(--border); border-top: 3px solid var(--accent);
  border-radius: 8px; padding: 10px 12px; height: 100%;
}
.epic-name { font-weight: 600; }
.epic-meta { color: var(--muted); font-size: 0.75rem; font-family: var(--mono); margin-top: 2px; display: flex; justify-content: space-between; gap: 8px; }
.epic-desc { color: var(--muted); font-size: 0.78rem; padding: 2px 12px 12px; position: relative; z-index: 1; }

.release {
  grid-column: 1 / -1; position: sticky; left: 0; z-index: 1;
  padding: 22px 16px 16px; margin: 14px 0 12px; background: var(--bg);
  border-top: 1px solid var(--lane-border); border-bottom: 1px solid var(--lane-border);
  max-width: calc(100vw - 48px);
}
.release-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.release-name { font-weight: 700; font-size: 1.25rem; }
.release-meta { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.details-btn {
  background: var(--accent-tint); color: var(--accent); border: 1px solid var(--accent);
  border-radius: 999px; padding: 5px 14px; font: inherit; font-size: 0.82rem; font-weight: 500; cursor: pointer; min-height: 32px;
}
@media (hover: hover) { .details-btn:hover { background: rgba(45, 212, 191, 0.22); } }
.release-outcome {
  max-width: 900px; margin: 10px 0 0;
  color: var(--text); font-size: 1.12rem; line-height: 1.5; font-weight: 500;
  border-left: 3px solid var(--accent); padding-left: 14px;
}
.release-risk {
  max-width: 900px; margin-top: 10px; font-size: 0.85rem; color: var(--amber);
  background: var(--amber-tint); border-left: 3px solid var(--amber); border-radius: 4px; padding: 8px 12px;
}
.release-risk b { font-weight: 600; }

/* ---------- release details modal ---------- */
dialog.rel-modal {
  width: min(1240px, 94vw); max-height: 92vh; padding: 0; border: 1px solid var(--border); border-radius: 14px;
  background: var(--bg); color: var(--text); box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
dialog.rel-modal::backdrop { background: rgba(5, 6, 8, 0.72); }
.rm-head {
  position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 26px 64px 20px 32px;
}
.rm-head .release-outcome { max-width: none; font-size: 1.2rem; }
.rm-head .release-risk { max-width: none; }
.rm-close {
  position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 1.1rem; cursor: pointer;
}
.rm-body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; padding: 24px 32px 32px; }
.rm-body h3 { margin: 0 0 14px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.can-do-groups { columns: 2 280px; column-gap: 32px; }
.can-do-group { break-inside: avoid; margin-bottom: 22px; }
.can-do-group h4 { margin: 0 0 6px; font-size: 0.95rem; font-weight: 600; color: var(--accent); }
.can-do-group ul { margin: 0; padding-left: 18px; font-size: 0.9rem; line-height: 1.5; }
.can-do-group li { margin: 4px 0; }
.rm-side { display: flex; flex-direction: column; gap: 12px; }
.rm-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.rm-card h3 { margin-bottom: 6px; }
.rm-card p { margin: 0; font-size: 0.88rem; line-height: 1.5; }
.cell { display: flex; flex-direction: column; gap: 8px; padding: 0 8px 12px; min-height: 20px; position: relative; z-index: 1; }
.cell-label { display: none; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 11px; cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%;
  transition: border-color .12s, background .12s, opacity .12s;
}
@media (hover: hover) { .card:hover { border-color: #4a515d; } }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.card-top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.72rem; color: var(--muted); font-family: var(--mono); }
.card-sum { margin-top: 4px; font-size: 0.86rem; }
.card-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.pill {
  font-size: 0.7rem; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--border);
  color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.pill.est { color: var(--text); }
.pill.dep { color: var(--amber); border-color: rgba(245,158,11,.4); }

.card.selected { border-color: var(--accent); background: var(--accent-tint); }
.card.is-blocker { border-color: var(--amber); background: var(--amber-tint); }
.card.is-blocked { border-color: var(--accent); border-style: dashed; }
.map.focus .card:not(.selected):not(.is-blocker):not(.is-blocked) { opacity: 0.35; }
.card[hidden] { display: none; }


.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 0.78rem; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.lg-sel::before { background: var(--accent-tint); border: 1px solid var(--accent); }
.lg-blk::before { background: var(--amber-tint); border: 1px solid var(--amber); }
.lg-bd::before { border: 1px dashed var(--accent); }

/* ---------- detail panel ---------- */
.panel {
  position: fixed; right: 0; top: 0; bottom: 0; width: min(400px, 100vw); z-index: 10;
  background: var(--surface); border-left: 1px solid var(--border); padding: 20px 22px;
  transform: translateX(100%); transition: transform .18s ease; overflow-y: auto;
  box-shadow: -12px 0 30px rgba(0,0,0,.35);
}
.panel.open { transform: none; }
.panel-close {
  position: absolute; top: 12px; right: 12px; background: none; border: 1px solid var(--border);
  color: var(--muted); border-radius: 8px; width: 36px; height: 36px; font-size: 1.1rem; cursor: pointer;
}
.panel h2 { font-size: 1.05rem; margin: 6px 40px 14px 0; line-height: 1.35; }
.panel .key { font-family: var(--mono); color: var(--muted); font-size: 0.8rem; }
.panel dl { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 0 0 16px; font-size: 0.86rem; }
.panel dt { color: var(--muted); }
.panel dd { margin: 0; font-variant-numeric: tabular-nums; }
.panel h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
.dep-list { display: grid; gap: 6px; }
.dep-link {
  display: block; text-align: left; width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; color: var(--text); font: inherit; font-size: 0.84rem; cursor: pointer;
}
.dep-link .key { margin-right: 6px; }
.dep-link.blocker { border-left: 3px solid var(--amber); }
.dep-link.blocked { border-left: 3px solid var(--accent); }
.none { color: var(--muted); font-size: 0.84rem; }
.jira { display: inline-block; margin-top: 18px; font-size: 0.86rem; }

/* ---------- mobile ---------- */
@media (max-width: 720px) {
  header { padding: 16px 16px 10px; }
  select { height: 44px; font-size: 16px; width: 100%; }
  .chip { min-height: 44px; }
  .map-wrap { max-height: none; overflow: visible; padding: 0 16px 40px; }
  .map { display: block; min-width: 0; }
  .epic, .lane, .epic-desc { display: none; }
  .cell { padding: 0; }
  .release { padding: 22px 0 12px; }
  .release { position: static; max-width: none; }
  dialog.rel-modal { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; border: 0; }
  .rm-head { position: static; padding: 18px 60px 16px 16px; }
  .rm-close { position: fixed; top: 12px; right: 12px; z-index: 2; }
  .rm-body { grid-template-columns: 1fr; padding: 18px 16px 28px; gap: 20px; }
  .details-btn { min-height: 44px; }
  .cell { padding: 4px 0 10px; }
  .cell.empty-cell { display: none; }
  .cell-label {
    display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); margin-top: 6px;
  }
  .card { padding: 12px 14px; }
  .card-sum { font-size: 0.95rem; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="controls">
    <select id="sort" aria-label="Order within each cell">
      <option value="start">Order: start date</option>
      <option value="est-desc">Order: estimate ▼</option>
      <option value="est-asc">Order: estimate ▲</option>
      <option value="key">Order: Jira key</option>
    </select>
  </div>
  <div class="legend"><span class="lg-sel">Selected</span><span class="lg-blk">Blocks the selected story</span><span class="lg-bd">Blocked by the selected story</span></div>
</header>
<div class="map-wrap"><div class="map" id="map"></div></div>
<aside class="panel" id="panel" aria-hidden="true"></aside>
<dialog class="rel-modal" id="relModal" aria-label="Release details"></dialog>

ng CHIRP staff see it with the conversation attached and withdraw the answer or the record behind it.", "url": "https://zigzagai.atlassian.net/browse/T2DV-72"}, {"order": 7, "key": "T2DV-70", "name": "Keep the data accurate", "description": "The work that keeps the reports in the database complete, current and correctly coded: proposing and confirming SHIELD codes, loading CHIRP's own reports, and picking up newly published reports automatically.", "url": "https://zigzagai.atlassian.net/browse/T2DV-70"}, {"order": 8, "key": "T2DV-73", "name": "Run the service safely", "description": "Running the chat reliably and safely for staff and the public: deployment, logging every question, monitoring and backups, clear failure messages, usage limits and a spending cap on the AI bill, refusing off-topic or manipulative questions, keeping public users away from staff tools, and a closed beta before launch.", "url": "https://zigzagai.atlassian.net/browse/T2DV-73"}], "releases": [{"order": 1, "name": "Release 1: Staff chat", "start_date": "2026-11-16", "release_date": "2026-12-18", "target_outcome": "CHIRP staff can answer \"how many\" questions about UK and US marine accidents themselves, in minutes rather than by searching reports by hand, and they can trust each answer because every claim links to the page it came from.", "estimate_days": 21, "details": {"Who it's for": "CHIRP staff only, signing in with their existing CHIRPdb accounts. Nothing is open to the public yet.", "What people can do": [{"epic": "Ask a question", "items": ["Open a basic chat page, sign in with a staff account and type a question in plain English.", "Watch the answer appear as it is written, rather than waiting on a blank screen.", "Get answers drawn from the CHIRPdb database, not the AI's general knowledge.", "Ask for comparisons, such as UK against US collisions since 2015, and get the figures side by side with the biggest differences pointed out.", "Read answers in plain maritime English, with lessons that come only from the reports cited.", "Use the chat on a phone, in the main browsers, with a layout that works on small screens and with a keyboard or screen reader."]}, {"epic": "Spot patterns across reports", "items": ["Ask how many incidents match some criteria, such as fishing vessels that sank since 2016, and get one exact number that matches a direct database query.", "Combine several filters at once, such as vessel type, country, date range and deaths.", "Split counts into groups, such as by country or by vessel type, and count reports that mention particular words, such as \"enclosed space\"."]}, {"epic": "Check the evidence", "items": ["Click any claim in an answer and open the source PDF at the right page.", "Rely on every claim having been checked against the passage it cites before the answer is shown. Figures are checked against the counting tool's result.", "See unsupported claims removed, after one retry, with a note saying so. If nothing useful is left, the chat says the question couldn't be answered from the reports.", "Know that answers are tested against a fixed set of questions with known right answers after every change, and that a failure stops the change going live."]}, {"epic": "Learn from similar incidents", "items": ["Ask for a toolbox talk or briefing on a task, and get one that fits on a page and cites real cases.", "Describe a near miss and be pointed to CHIRP's reporting form."]}, {"epic": "Run the service safely", "items": ["Use the chat at a secure web address, deployed automatically when changes pass their tests.", "See a clear message if something fails, such as the AI timing out or the provider being down, rather than a broken reply.", "Switch AI model by configuration, but only once the test set passes on the new model.", "CHIRP staff can see a log of every question, who asked it, which reports were used, how long it took and what it cost."]}], "Not in this release": "Only UK and US reports are included, and only the basic fields compare like for like between them. There is no \"find similar incidents\" search, no follow-up questions, no SHIELD code review, and no public access.", "CHIRP to agree": "Answer speed targets, the maximum number of tool calls per question, the size of the test set, the accessibility standard, the near-miss form address, and how long the question log is kept."}}, {"order": 2, "name": "Release 2: Full answers", "start_date": "2027-01-04", "release_date": "2027-01-29", "target_outcome": "Staff can compare UK and US accidents on any field with confidence that like is being compared with like, find past incidents similar to one they describe, and start building a checked set of SHIELD codes.", "estimate_days": 23, "details": {"Who it's for": "CHIRP staff, including the people who review SHIELD codes.", "What people can do": [{"epic": "Ask a question", "items": ["Ask a follow-up, such as \"and in the US?\", without repeating the original question."]}, {"epic": "Spot patterns across reports", "items": ["Compare UK and US reports on vessel type and accident type using one shared list of terms, so \"fishing vessel\", \"fishing\" and \"trawler\" count as the same thing.", "Do the same for outcome, severity and the remaining incident fields.", "Filter and group counts by the extra detail extracted from every UK and US report."]}, {"epic": "Check the evidence", "items": ["Rely on test-set questions covering every shared field."]}, {"epic": "Learn from similar incidents", "items": ["Describe what happened in your own words, such as \"bulk carrier grounded at night, one person on watch\", and get the most similar past incidents, closest first, each with a summary and a link.", "Ask for near-miss answers and task briefings that bring similar incidents together with their shared factors."]}, {"epic": "Keep the data accurate", "items": ["Review proposed SHIELD codes for every UK and US report in the review tool, and confirm or reject each one.", "Count by SHIELD code, using ries in the same review tool, filtered by country.", "Have CHIRP's own reports imported, with confidential fields left out and no duplicates if the import is run again.", "Have every source checked for newly published reports on a schedule. New reports are processed and added to answers automatically, and staff can see what was added. If a source can't be reached, staff are told."]}, {"epic": "Check the evidence", "items": ["Rely on a test set that covers every country, CHIRP's reports, duplicate accidents and approved patterns. Every Release 2 question must still pass."]}], "Not in this release": "There is still no public access.", "CHIRP to agree": "The acceptable share of unmapped reports per country, SHIELD spot-check sizes and accuracy, the export format and confidential fields for CHIRP reports, the date window for duplicate matching and a list of known duplicates, how often to check for new reports and who is alerted, and the test-set size and pass rate."}}, {"order": 4, "name": "Release 4: Public access", "start_date": "2027-03-11", "release_date": "2027-04-09", "target_outcome": "The chat is ready for seafarers to use safely. They can sign up, use it within limits that protect CHIRP's budget, and control their own data. CHIRP can catch and correct a wrong answer before it spreads.", "estimate_days": 21.5, "details": {"Who it's for": "Members of the public, starting with seafarers. Nobody outside CHIRP sees it until the beta in Release 5.", "What people can do": [{"epic": "Get access", "items": ["Sign up with an email address, verify it, and get a public account that has no access to staff tools.", "Sign in, stay signed in on a device, reset a forgotten password and sign out.", "Accept CHIRP's terms and privacy notice before the first question, and again when they change.", "Keep past conversations, reopen them and carry on, or delete them.", "Download a copy of everything the service holds about you.", "Delete your account and all your data."]}, {"epic": "Report a problem", "items": ["Flag an answer you think is wrong, pick a reason and add a note.", "CHIRP staff see flagged answers with the full conversation and sources, mark each one right or wrong, and get a regular email of new flags.", "CHIRP staff can withdraw a wrong answer, so the person who got it sees a notice, or hide a bad report or field so it isn't used again. Every change is recorded, and can be undone."]}, {"epic": "Run the service safely", "items": ["Public users get a daily question limit, with a warning before they reach it. Staff have no limit.", "The AI bill has a monthly cap. CHIRP is warned as it approaches, public questions pause when it is reached, and they start again the next month.", "Off-topic questions and attempts to manipulate the chat are refused politely and logged.", "Public accounts can't reach staff pages, staff tools or staff-only data, and an automated test checks this.", "Before anyone outside CHIRP sees it, the public setup is tested for misuse, heavy use and every step a user takes, on desktop and mobile."]}], "Not in this release": "There are no outside users yet, and no landing page or help pages.", "CHIRP to agree": "Password rules and sign-in timings, the daily question limit, the spending cap and warning level, how deleted users' questions are handled in the log, how long backups keep deleted data, the refusal test set, and load test targets."}}, {"order": 5, "name": "Release 5: Launch", "start_date": "2027-04-09", "release_date": "2027-04-16", "target_outcome": "Real seafarers have tried the chat and their most important problems are fixed. It is open to anyone, easy to find, and explains what it can and can't do.", "estimate_days": 7, "details": {"Who it's for": "A closed group of invited seafarers first, then the public.", "What people can do": [{"epic": "Get access", "items": ["Invited seafarers sign up during a closed beta. Anyone else can leave their email to hear when it opens.", "Find the chat from a public landing page that explains what it does, where its information comes from and who funds it.", "Read short help pages on asking good questions, how source links work, what is covered, what the chat can't do, and how to flag a wrong answer. CHIRP staff get a guide to every staff tool."]}, {"epic": "Report a problem", "items": ["Beta testers give feedback through a short form. CHIRP sees a summary of feedback, flags and usage, and agrees a ranked list of fixes with Tandem."]}, {"epic": "Run the service safely", "items": ["The top issues from the beta are fixed within a two-day budget. Anything left over is written up for after launch.", "On launch day sign-up opens to everyone, the waiting list is emailed, and monitoring, limits and the spending cap are confirmed. Sign-up can be closed again within minutes if something goes wrong."]}], "Known risk": "The current dates give the beta about one day between invitations and feedback, which isn't enough for real use. The Statement of Work had beta seafarers due on 19 March. Running the beta alongside the end of Release 4 would give testers several weeks. This needs agreeing with ZigZag.", "CHIRP to agree": "The number of beta testers, the landing page address and copy, the wording on the chat's limits, and the launch-day spending cap."}}], "stories": [{"key": "T2DV-74", "summary": "Send a question to the AI and stream the answer back", "epic": "T2DV-66", "release": 1, "estimate_days": 2, "status": "To Do", "start_date": "2026-11-16", "due_date": "2026-11-17", "blocked_by": [], "blocks": ["T2DV-75", "T2DV-76"], "url": "https://zigzagai.atlassian.net/browse/T2DV-74"}, {"key": "T2DV-75", "summary": "Answer counting questions using the database tools", "epic": "T2DV-66", "release": 1, "estimate_days": 1, "status": "To Do", "start_date": "2026-11-18", "due_date": "2026-11-18", "blocked_by": ["T2DV-74"], "blocks": ["T2DV-78", "T2DV-80", "T2DV-86", "T2DV-87", "T2DV-136"], "url": "https://zigzagai.atlassian.net/browse/T2DV-75"}, {"key": " 2027-04-08", "blocked_by": [], "blocks": ["T2DV-134"], "url": "https://zigzagai.atlassian.net/browse/T2DV-132"}, {"key": "T2DV-133", "summary": "Read how to use the chat and what it can't do", "epic": "T2DV-71", "release": 5, "estimate_days": 1, "status": "To Do", "start_date": "2027-04-08", "due_date": "2027-04-12", "blocked_by": [], "blocks": ["T2DV-134"], "url": "https://zigzagai.atlassian.net/browse/T2DV-133"}, {"key": "T2DV-134", "summary": "Open the chat to the public", "epic": "T2DV-73", "release": 5, "estimate_days": 0.5, "status": "To Do", "start_date": "2027-04-14", "due_date": "2027-04-14", "blocked_by": ["T2DV-131", "T2DV-132", "T2DV-133"], "blocks": [], "url": "https://zigzagai.atlassian.net/browse/T2DV-134"}, {"key": "T2DV-135", "summary": "Sign in to the chat with my CHIRPdb staff account", "epic": "T2DV-71", "release": 1, "estimate_days": 1, "status": "To Do", "start_date": "2026-11-16", "due_date": "2026-11-16", "blocked_by": [], "blocks": ["T2DV-76"], "url": "https://zigzagai.atlassian.net/browse/T2DV-135"}, {"key": "T2DV-136", "summary": "Search report text to answer \"what went wrong\" questions", "epic": "T2DV-66", "release": 2, "estimate_days": 1, "status": "To Do", "start_date": "2027-01-14", "due_date": "2027-01-14", "blocked_by": ["T2DV-75"], "blocks": ["T2DV-81", "T2DV-137"], "url": "https://zigzagai.atlassian.net/browse/T2DV-136"}, {"key": "T2DV-137", "summary": "Check each written claim against the passage it cites", "epic": "T2DV-67", "release": 2, "estimate_days": 1, "status": "To Do", "start_date": "2027-01-18", "due_date": "2027-01-18", "blocked_by": ["T2DV-82", "T2DV-136"], "blocks": ["T2DV-81"], "url": "https://zigzagai.atlassian.net/browse/T2DV-137"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const epics = [...DATA.epics].sort((a, b) => a.order - b.order);
const releases = [...DATA.releases].sort((a, b) => a.order - b.order);
const stories = DATA.stories;
const byKey = new Map(stories.map(s => [s.key, s]));
const epicByKey = new Map(epics.map(e => [e.key, e]));
const releaseByOrder = new Map(releases.map(r => [r.order, r]));

const state = { sort: "start", selected: null };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDateY = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—";
const days = n => `${+n}d`;
const sumDays = list => list.reduce((t, s) => t + (+s.estimate_days || 0), 0);

const sorters = {
  start: (a, b) => (a.start_date || "").localeCompare(b.start_date || "") || a.key.localeCompare(b.key, undefined, { numeric: true }),
  "est-desc": (a, b) => b.estimate_days - a.estimate_days,
  "est-asc": (a, b) => a.estimate_days - b.estimate_days,
  key: (a, b) => a.key.localeCompare(b.key, undefined, { numeric: true }),
};

function cardHTML(s) {
  const deps = (s.blocked_by || []).length;
  const cls = ["card"];
  if (state.selected) {
    const sel = byKey.get(state.selected);
    if (s.key === sel.key) cls.push("selected");
    else if ((sel.blocked_by || []).includes(s.key)) cls.push("is-blocker");
    else if ((sel.blocks || []).includes(s.key)) cls.push("is-blocked");
  }
  return `<button class="${cls.join(" ")}" data-key="${esc(s.key)}">
    <div class="card-top"><span>${esc(s.key)}</span></div>
    <div class="card-sum">${esc(s.summary)}</div>
    <div class="card-foot"><span class="pill est">${days(s.estimate_days)}</span>${deps ? `<span class="pill dep">waits on ${deps}</span>` : ""}</div>
  </button>`;
}

function releaseHeadHTML(r, rs, withButton) {
  const risk = (r.details || {})["Known risk"];
  return `<div class="release-head">
      <span class="release-name">${esc(r.name)}</span>
      <span class="release-meta">${rs.length} stories · ${days(sumDays(rs))}</span>
      ${withButton ? `<button class="details-btn" data-r="${r.order}">Release details</button>` : ""}
    </div>
    <p class="release-outcome">${esc(r.target_outcome)}</p>
    ${risk ? `<div class="release-risk"><b>Known risk:</b> ${esc(risk)}</div>` : ""}`;
}

function openReleaseModal(order) {
  const r = releaseByOrder.get(order);
  const rs = stories.filter(s => s.release === order);
  const d = { ...(r.details || {}) };
  delete d["Known risk"];
  const canDo = d["What people can do"] || [];
  delete d["What people can do"];
  const m = $("relModal");
  m.innerHTML = `<div class="rm-head">
      <button class="rm-close" aria-label="Close">✕</button>
      ${releaseHeadHTML(r, rs, false)}
      <div class="release-meta" style="margin-top:10px">${fmtDateY(r.start_date)} → ${fmtDateY(r.release_date)}</div>
    </div>
    <div class="rm-body">
      <section>
        <h3>What people can do</h3>
        <div class="can-do-groups">${canDo.map(g => `<div class="can-do-group"><h4>${esc(g.epic)}</h4>
          <ul>${g.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      </section>
      <aside class="rm-side">${Object.entries(d).map(([n, v]) =>
        `<div class="rm-card"><h3>${esc(n)}</h3><p>${esc(v)}</p></div>`).join("")}</aside>
    </div>`;
  m.showModal();
  m.scrollTop = 0;
}

function render() {
  const map = $("map");
  map.style.setProperty("--cols", epics.length);
  map.classList.toggle("focus", !!state.selected);

  const rowCount = 2 + releases.length * 2;
  map.style.gridTemplateRows = `repeat(${rowCount}, auto)`;
  let html = epics.map((e, i) => {
    const es = stories.filter(s => s.epic === e.key);
    return `<div class="lane" style="grid-column:${i + 1}"></div><div class="epic" style="grid-area:1/${i + 1}"><div class="epic-lane-top"><div class="epic-inner">
      <div class="epic-name">${esc(e.name)}</div>
      <div class="epic-meta"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.key)}</a><span>${es.length} · ${days(sumDays(es))}</span></div>
    </div></div></div><div class="epic-desc" style="grid-area:2/${i + 1}">${esc(e.description)}</div>`;
  }).join("");

  releases.forEach((r, k) => {
    const rs = stories.filter(s => s.release === r.order);
    html += `<div class="release" style="grid-row:${2 * k + 3}">${releaseHeadHTML(r, rs, true)}</div>`;
    epics.forEach((e, i) => {
      const cell = rs.filter(s => s.epic === e.key).sort(sorters[state.sort]);
      html += `<div class="cell${cell.length ? "" : " empty-cell"}" style="grid-area:${2 * k + 4}/${i + 1}"><div class="cell-label">${esc(e.name)}</div>${cell.map(cardHTML).join("")}</div>`;
    });
  });
  map.innerHTML = html;
}

function depButtons(keys, cls) {
  if (!keys || !keys.length) return `<div class="none">None</div>`;
  return `<div class="dep-list">${keys.map(k => {
    const d = byKey.get(k);
    return `<button class="dep-link ${cls}" data-key="${esc(k)}"><span class="key">${esc(k)}</span>${esc(d ? d.summary : "(not in this export)")}</button>`;
  }).join("")}</div>`;
}

function openPanel(key) {
  const s = byKey.get(key);
  if (!s) return;
  state.selected = key;
  const e = epicByKey.get(s.epic), r = releaseByOrder.get(s.release);
  const p = $("panel");
  p.innerHTML = `<button class="panel-close" aria-label="Close">✕</button>
    <div class="key">${esc(s.key)}</div>
    <h2>${esc(s.summary)}</h2>
    <dl>
      <dt>Epic</dt><dd>${esc(e ? e.name : s.epic)}</dd>
      <dt>Release</dt><dd>${esc(r ? r.name : s.release)}</dd>
      <dt>Estimate</dt><dd>${+s.estimate_days} working day${+s.estimate_days === 1 ? "" : "s"}</dd>
      <dt>Dates</dt><dd>${fmtDateY(s.start_date)} → ${fmtDateY(s.due_date)}</dd>
      <dt>Status</dt><dd>${esc(s.status)}</dd>
    </dl>
    <h3>Blocked by (do these first)</h3>${depButtons(s.blocked_by, "blocker")}
    <h3>Blocks</h3>${depButtons(s.blocks, "blocked")}
    <a class="jira" href="${esc(s.url)}" target="_blank" rel="noopener">Open in Jira ↗</a>`;
  p.classList.add("open");
  p.setAttribute("aria-hidden", "false");
  render();
  const card = document.querySelector(`.card[data-key="${CSS.escape(key)}"]`);
  if (card) card.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
}

function closePanel() {
  state.selected = null;
  $("panel").classList.remove("open");
  $("panel").setAttribute("aria-hidden", "true");
  render();
}

/* ---------- init ---------- */
$("title").textContent = "CHIRPdb Tranche 2 Story Map";
$("sub").textContent = `${DATA.project.jira_space} · ${stories.length} stories · estimates in working days`;
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("map").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const btn = e.target.closest(".details-btn");
  if (btn) return openReleaseModal(+btn.dataset.r);
  const card = e.target.closest(".card");
  if (!card) return;
  card.dataset.key === state.selected ? closePanel() : openPanel(card.dataset.key);
});
$("panel").addEventListener("click", e => {
  if (e.target.closest(".panel-close")) return closePanel();
  const dep = e.target.closest(".dep-link");
  if (dep && byKey.has(dep.dataset.key)) openPanel(dep.dataset.key);
});
$("relModal").addEventListener("click", e => {
  if (e.target === e.currentTarget || e.target.closest(".rm-close")) $("relModal").close();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.selected && !$("relModal").open) closePanel(); });

render();
</script>
</body>
</html>
