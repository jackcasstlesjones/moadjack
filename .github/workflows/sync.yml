name: Sync from Jira

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write .env from secrets
        env:
          ATLASSIAN_EMAIL_ACCOUNT: ${{ secrets.ATLASSIAN_EMAIL_ACCOUNT }}
          ATLASSIAN_API_KEY: ${{ secrets.ATLASSIAN_API_KEY }}
        run: |
          printf 'ATLASSIAN_EMAIL_ACCOUNT=%s\nATLASSIAN_API_KEY=%s\n' \
            "$ATLASSIAN_EMAIL_ACCOUNT" "$ATLASSIAN_API_KEY" > .env

      - name: Build from Jira
        run: python3 build.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- stories.json index.html; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add stories.json index.html
          git commit -m "Sync from Jira $(date -u +%F)"
          git push
